services:
  postgres:
    image: postgres:16-alpine
    container_name: flowkit-postgres
    environment:
      POSTGRES_USER: flowkit
      POSTGRES_PASSWORD: flowkit
      POSTGRES_DB: flowkit
    ports:
      - "5432:5432"
    volumes:
      - flowkit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowkit-redis
    ports:
      - "6380:6379"
    volumes:
      - flowkit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowkit-postgres-data:
  flowkit-redis-data:
